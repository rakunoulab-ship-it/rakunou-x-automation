name: ゲームニュース ダイジェスト投稿（21時）

on:
  schedule:
    # UTC基準。21:12 JSTに実行
    # ちょうど正時（21:00）は、他の大量のワークフローと重なり混雑しやすく、
    # 実行開始が1〜2時間規模で遅れることがあったため、数分ずらしている。
    # 19:06生成→21:12投稿で、6分の余裕を保ちつつ正時から離している。
    - cron: '12 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: ダイジェストへのリンクを投稿
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python src/digest_poster.py

      - name: 投稿記録をコミット
        run: |
          git config user.name "rakunou-x-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posted_digest_log.json
          git diff --cached --quiet || git commit -m "chore: record posted digest date [skip ci]"
          git push

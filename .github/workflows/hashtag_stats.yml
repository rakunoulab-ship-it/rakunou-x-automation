name: ハッシュタグ投稿数チェック（手動実行）

# 自動スケジュールは設定していません（毎日実行するとコストがかさむため）。
# 必要なときに「Actions」タブから「Run workflow」で手動実行してください。

on:
  workflow_dispatch:
    inputs:
      hashtags:
        description: '調べたいハッシュタグ・キーワード（カンマ区切り。空欄ならデフォルト一覧を使用）'
        required: false
        default: ''

jobs:
  check-hashtags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: 投稿数チェック
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          HASHTAGS: ${{ github.event.inputs.hashtags }}
        run: python src/hashtag_stats.py
